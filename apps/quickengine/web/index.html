<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" href="/logo.svg" type="image/svg+xml" />
		<title>QuickEngine — Build more. Switch less.</title>
		<meta
			name="description"
			content="A modular business operating system. Enable only the modules your business needs."
		/>
	</head>
	<body>
		<script>
			// Runs before first paint. Any React-level fix necessarily runs after the
			// browser has already painted the wrong theme, which is the flash.
			(() => {
				const stored = localStorage.getItem("quickengine-theme") ?? "dark";
				const dark =
					stored === "dark" ||
					(stored === "system" &&
						window.matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.classList.toggle("dark", dark);
				document.documentElement.classList.toggle("light", !dark);
			})();
		</script>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
