<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex, nofollow" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<title>Sign in — QuickEngine</title>
		<style>
			/* 🔴 Inline, and BEFORE any stylesheet loads.

			   Navigating between surfaces — QuickDash to Account — is a full
			   document load across origins, so the browser paints a blank page
			   before a single line of our CSS or JavaScript exists. Painting that
			   blank page white is the flash; the fix has to be here, in the markup
			   the browser gets first.

			   The colour is hard-coded rather than a token for the same reason:
			   `--console-bg` is defined in a stylesheet that has not arrived yet. It
			   must stay in step with `theme.css`. */
			html,
			body {
				margin: 0;
				background: #0a0a0a;
			}

			/* ⚠️ The light counterpart. Without it the hard-coded dark above wins
			   for a light visitor and they get the very flash this block exists to
			   prevent, just in the other direction. Must stay in step with
			   `--ob-page` / `--console-bg` in `theme.css`. */
			html.light,
			html.light body {
				background: #e8f0f5;
			}

			/* The same mark React shows while a route resolves, so the handover from
			   document load to app boot is invisible. Removed automatically: React
			   clears the container on its first render. */
			#boot {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			#boot > span {
				width: 10rem;
				height: 2.5rem;
				border-radius: 0.375rem;
				transform: skewX(-12deg);
				background-image: linear-gradient(
					90deg,
					rgb(237 237 237 / 0.10) 0%,
					rgb(237 237 237 / 0.10) 35%,
					rgb(237 237 237 / 0.30) 50%,
					rgb(237 237 237 / 0.10) 65%,
					rgb(237 237 237 / 0.10) 100%
				);
				background-size: 200% 100%;
				animation: boot-shimmer 1s linear infinite;
			}

			@keyframes boot-shimmer {
				from {
					background-position: 200% 0;
				}
				to {
					background-position: -200% 0;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				#boot > span {
					animation: none;
				}
			}
		</style>
	</head>
	<body>
		<script>
			/* 🔴 Runs BEFORE first paint, and reads the COOKIE.

			   Moving between surfaces is a full document load across origins, so
			   each app decides its own theme from scratch. Two of them never did:
			   QuickDash and auth hard-coded `class="dark"` and painted `#0a0a0a`,
			   so a light theme chosen in onboarding was thrown away the moment
			   somebody opened their workspace.

			   ⚠️ The cookie, not `localStorage`. `localStorage` is partitioned by
			   ORIGIN, so `quickdash.xyz` and `account.quickdash.xyz` each keep their
			   own copy and the theme resets on every hop. The cookie is written on
			   the parent domain by `ThemeProvider` precisely so all of them share
			   one value; `localStorage` is read only as a fallback, to migrate a
			   browser that still has the old key.

			   Inline and synchronous on purpose: any React-level fix necessarily
			   runs after the browser has already painted the wrong theme, which is
			   the flash it exists to prevent. */
			(() => {
				const cookie = document.cookie.match(
					/(?:^|; )quickengine-theme=([^;]*)/,
				);
				const stored =
					cookie?.[1] || localStorage.getItem("quickengine-theme");
				const theme =
					stored === "light" || stored === "dark" || stored === "system"
						? stored
						: "system";
				const dark =
					theme === "dark" ||
					(theme === "system" &&
						window.matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.classList.toggle("dark", dark);
				document.documentElement.classList.toggle("light", !dark);
			})();
		</script>
		<div id="root">
			<div id="boot"><span></span></div>
		</div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
